[project]
name = "screamtest"
version = "0.1.0"
description = "Proves a cloud resource is safe to remove, then removes it reversibly. The LLM plans and judges; data decides."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
screamtest = "screamtest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
